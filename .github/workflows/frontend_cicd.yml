name: LocCam Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1 : Build & Type Check ────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification TypeScript
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_API_URL: https://loccam-backend.onrender.com/api/v1

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://loccam-backend.onrender.com/api/v1

  # ── Job 2 : Deploy Production via API Vercel (main) ───────
  deploy:
    name: Deploy sur Vercel
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Déclencher le deploy Vercel
        run: |
          curl -X POST \
            "https://api.vercel.com/v1/integrations/deploy/${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json"

  # ── Job 3 : Deploy Preview (develop) ──────────────────────
  preview:
    name: Deploy Preview
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Déclencher le deploy Preview Vercel
        run: |
          curl -X POST \
            "https://api.vercel.com/v1/integrations/deploy/${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"develop"}'